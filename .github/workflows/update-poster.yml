name: Heimspiel-Poster aktualisieren

on:
  schedule:
    - cron: '24 5 * * 1'  # Montags 6:24 Uhr MESZ (UTC+2) / 05:24 Uhr MEZ im Winter
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Playwright installieren
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Poster rendern (Instagram-Format)
        run: python generate_poster.py

      - name: Poster rendern (A3-Druckformat)
        run: python generate_poster_a3.py

      - name: Aenderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add poster.png poster_a3.png
          git diff --cached --quiet && echo "Keine Aenderungen" || git commit -m "Heimspiel-Poster aktualisiert"
          git push
