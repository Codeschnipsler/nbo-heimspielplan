name: Heimspielplan aktualisieren

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Spielplan-Daten abrufen
        run: python update_heimspielplan.py

      - name: Aenderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add heimspiele.json
          git diff --cached --quiet && echo "Keine Aenderungen" || git commit -m "Heimspielplan aktualisiert"
          git push
