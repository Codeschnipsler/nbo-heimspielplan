<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBO — Tabellen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --nbo-blue:#1D4E93;
    --nbo-blue-dark:#123564;
    --nbo-blue-light:#EAF1FA;
    --ink:#111111;
    --grey:#F2F2F2;
    --grey-line:#E1E1E1;
    --muted:#6B6B6B;
    --white:#FFFFFF;
    --win:#2E7D46;
    --win-bg:#E7F3EA;
    --loss:#B23A3A;
    --loss-bg:#F8EAEA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--white);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    font-size:16px;
    line-height:1.55;
  }
  .wrap{max-width:720px; margin:0 auto;}

  header.site-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--grey-line);
  }
  .logo-mark{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:var(--nbo-blue);
  }
  .logo-img{height:46px; width:auto; display:block;}
  .logo-mark .word{
    font-family:'Anton', sans-serif;
    font-size:1.3rem;
    color:var(--nbo-blue);
    letter-spacing:0.02em;
  }
  header.site-header .sub{
    font-size:0.78rem;
    color:var(--muted);
    text-align:right;
  }

  .page-nav{
    display:flex;
    gap:16px;
    padding:10px 20px;
    background:var(--grey);
    border-bottom:1px solid var(--grey-line);
    font-size:0.85rem;
  }
  .page-nav a{color:var(--nbo-blue); text-decoration:none; font-weight:600;}
  .page-nav a:hover{text-decoration:underline;}
  .page-nav .current{color:var(--ink); font-weight:700;}

  .filter-band{
    background:var(--grey);
    padding:16px 20px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--grey-line);
  }
  .filter-band label{font-size:0.8rem; color:var(--muted); font-weight:600;}
  select#teamFilter{
    font-family:'Inter', sans-serif;
    font-size:0.9rem;
    font-weight:500;
    padding:7px 12px;
    border:1px solid var(--grey-line);
    border-radius:3px;
    background:var(--white);
    color:var(--ink);
  }
  .stand-label{font-size:0.8rem; color:var(--muted); margin-left:auto;}

  .empty-note{
    background:var(--grey);
    padding:18px 20px;
    font-size:0.95rem;
    color:var(--muted);
  }

  .liga-block{padding:26px 20px 10px;}
  .liga-heading{
    font-family:'Anton', sans-serif;
    text-transform:uppercase;
    color:var(--nbo-blue);
    font-size:1.1rem;
    letter-spacing:0.02em;
    margin:0 0 2px;
    padding-bottom:8px;
    border-bottom:2px solid var(--nbo-blue);
  }
  .liga-sub{
    font-size:0.78rem;
    color:var(--muted);
    margin:6px 0 14px;
  }

  table.standings{
    width:100%;
    border-collapse:collapse;
    font-size:0.86rem;
  }
  table.standings th{
    text-align:left;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--muted);
    font-weight:700;
    padding:0 6px 8px;
    border-bottom:1px solid var(--grey-line);
  }
  table.standings th.num, table.standings td.num{text-align:right;}
  table.standings td{
    padding:8px 6px;
    border-bottom:1px solid var(--grey-line);
    white-space:nowrap;
  }
  table.standings td.team{
    white-space:normal;
    font-weight:600;
  }
  table.standings tr.own td{
    background:var(--nbo-blue-light);
  }
  table.standings tr.own td.team{color:var(--nbo-blue-dark); font-weight:800;}
  table.standings td.rank{
    font-family:'Anton', sans-serif;
    color:var(--nbo-blue-dark);
    font-size:0.95rem;
  }
  table.standings td.diff.pos{color:var(--win);}
  table.standings td.diff.neg{color:var(--loss);}

  footer{
    margin-top:30px;
    padding:18px 20px 40px;
    font-size:0.78rem;
    color:var(--muted);
    text-align:center;
    background:var(--grey);
  }

  @media (max-width:480px){
    table.standings{font-size:0.78rem;}
    table.standings td, table.standings th{padding:6px 4px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <a class="logo-mark" href="https://www.newbaskets.de" target="_blank" rel="noopener">
      <img class="logo-img" src="logo-nbo-3d.png" alt="New Basket '92 Oberhausen">
    </a>
    <div class="sub">Tabellen<br>Saison 2026/27</div>
  </header>

  <nav class="page-nav">
    <a href="./index.html">Heimspiele</a>
    <a href="./auswaerts.html">Auswärtsspiele</a>
    <a href="./ergebnisse.html">Ergebnisse</a>
    <span class="current">Tabellen</span>
  </nav>

  <div class="filter-band">
    <label for="teamFilter">Mannschaft</label>
    <select id="teamFilter">
      <option value="all">Alle Mannschaften</option>
    </select>
    <span class="stand-label" id="standLabel"></span>
  </div>

  <div id="content"></div>

  <footer>Quelle: basketball-bund.net · <a href="https://www.newbaskets.de" style="color:var(--nbo-blue);">newbaskets.de</a></footer>
</div>

<script>
let LIGEN = [];

const teamOrder = ["1. Damen","2. Damen","3. Damen","U18","U16","U14 I","U14 II","U14 III","U14 o","U12 I","U12 II","U10"];

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtStand(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return 'Stand: ' + new Intl.DateTimeFormat('de-DE',{day:'2-digit', month:'2-digit', year:'numeric', timeZone:'Europe/Berlin'}).format(d);
}

function populateFilter(){
  const sel = document.getElementById('teamFilter');
  const present = teamOrder.filter(t => LIGEN.some(l => l.team===t));
  present.forEach(t=>{
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    sel.appendChild(opt);
  });
}

function tableBlock(liga){
  const rows = (liga.tabelle||[]).map(r=>{
    const diffCls = r.korbdiff > 0 ? 'pos' : (r.korbdiff < 0 ? 'neg' : '');
    const diffStr = (r.korbdiff > 0 ? '+' : '') + r.korbdiff;
    return `
      <tr class="${r.eigenes ? 'own' : ''}">
        <td class="rank">${r.rang}</td>
        <td class="team">${escapeHtml(r.team)}</td>
        <td class="num">${r.spiele}</td>
        <td class="num">${r.siege}-${r.niederlagen}</td>
        <td class="num">${r.koerbe}:${r.gegenKoerbe}</td>
        <td class="num diff ${diffCls}">${diffStr}</td>
        <td class="num">${r.gewinnpunkte}:${r.verlustpunkte}</td>
      </tr>`;
  }).join('');

  return `
    <div class="liga-block">
      <h2 class="liga-heading">${escapeHtml(liga.team)} &middot; ${escapeHtml(liga.liga)}</h2>
      <p class="liga-sub">${escapeHtml(liga.stand || '')}</p>
      <table class="standings">
        <thead>
          <tr>
            <th>#</th>
            <th>Team</th>
            <th class="num">Sp</th>
            <th class="num">S-N</th>
            <th class="num">Körbe</th>
            <th class="num">Diff</th>
            <th class="num">Pkt</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function render(){
  const sel = document.getElementById('teamFilter').value;
  const data = sel==='all' ? LIGEN : LIGEN.filter(l=>l.team===sel);

  const content = document.getElementById('content');
  if(!data.length){
    content.innerHTML = '<div class="empty-note">Für diese Auswahl liegt noch keine Tabelle vor.</div>';
    document.getElementById('standLabel').textContent = '';
    return;
  }

  content.innerHTML = data
    .sort((a,b)=> teamOrder.indexOf(a.team) - teamOrder.indexOf(b.team))
    .map(tableBlock).join('');

  document.getElementById('standLabel').textContent = fmtStand(window.ERZEUGT);
}

document.getElementById('teamFilter').addEventListener('change', render);

fetch('./tabellen.json', {cache: 'no-store'})
  .then(r => r.json())
  .then(data => {
    LIGEN = data.ligen || [];
    window.ERZEUGT = data.erzeugt;
    populateFilter();
    render();
  })
  .catch(() => {
    document.getElementById('content').innerHTML =
      '<div class="empty-note">Tabellen konnten nicht geladen werden. Bitte Seite neu laden.</div>';
  });
</script>
</body>
</html>
