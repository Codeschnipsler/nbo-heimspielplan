/* =====================================================================
   Elemente. Alle Werte [x, y, Breite, Höhe] in Prozent.
   Kasten (plate: true): deckt die Zahlen der Liga ab. d = Ziel, color = optionale eigene Farbe.
   ROI: Ausschnitt aus dem Grabber-Bild.
     s = Quelle im Grabber-Bild, d = Ziel auf dem Bildschirm
     edge    = schmaler Saum ganz außen (Pixel bei 1080p), der zusätzlich abgeschnitten wird;
               dort verlaufen die Farben ineinander. 0 = nichts extra abschneiden.
               (Der farbige Rand selbst wird automatisch erkannt, egal welche Farbe er hat.)
     recolor = färbt die sichtbaren Pixel um (z. B. weiß für dunkelblaue Gäste-Ziffern)
     fit     = 'contain' (Seitenverhältnis bleibt, Standard) oder 'fill'
   Die Positionen sind Startwerte: im Kalibrier-Modus (Taste D) feinjustieren.
   ===================================================================== */
const WHITE = [255, 255, 255];
const PETROL = [8, 114, 136]; // wie der schmale Balken links in der Liga-Grafik (#087288)
const DEFAULT_ITEMS = [
  // --- Kästen, so groß wie die Felder der Liga-Grafik ---
  // Das ganze Scoreboard wird aus eigenen Kästen aufgebaut (alle gleiche Höhe: y 83.89, h 11.76),
  // sodass es auch dann komplett zu sehen ist, wenn die Liga nichts anzeigt.

  { name: 'Kasten Namen',     plate: true, d: [3.29, 83.89, 26.2, 11.76] },                     // Platz für die Mannschaftsnamen
  { name: 'Kasten Punkte',    plate: true, d: [29.8, 83.89, 6.51, 11.76] },
  { name: 'Kasten Zeit',      plate: true, d: [36.72, 83.89, 7.29, 11.76] },
  { name: 'Kasten Wurfuhr',   plate: true, color: '#087288', d: [44.37, 83.89, 5.0, 11.76] },   // Petrol, mit kleinem Abstand angeschlossen

  // --- Mannschaftsnamen im Namensfeld (Text aus dem Spielplan, wird automatisch an die Breite angepasst) ---

  { name: 'Name Gast', text: 'gast', d: [4.12, 90.5, 18.9, 4.3] },

  // --- Ausschnitte aus dem Grabber-Bild ---

  { name: 'Fouls Gast',   s: [70.6, 44.0,  3.7,  7.9], d: [23.27, 90.5, 5.1, 4.3], edge: 1.5, recolor: PETROL }

/* ===================================================================== */
const q = new URLSearchParams(location.search);
const cfg = {};
for (const k in DEFAULTS) {
  const v = q.get(k);
  cfg[k] = v === null ? DEFAULTS[k] : (typeof DEFAULTS[k] === 'number' ? Number(v) : v);
}

const STORE = 'halle-roi-v4';
if (q.get('reset')) { try { localStorage.removeItem(STORE); } catch (e) {} }
let items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
// Kalibrierung übernehmen: zuerst der Browser-Speicher, sonst die Datei kalibrierung.js (neben der Seite).
// Zugeordnet wird über den Namen, so bleiben Werte auch erhalten, wenn eine neue Version Elemente ergänzt.
function numArr(a) { return Array.isArray(a) && a.length === 4 && a.every(x => typeof x === 'number' && isFinite(x)); }
function applyCalib(list) {
  if (!Array.isArray(list)) return false;
  let n = 0;
  for (const it of items) {
    const c = list.find(x => x && x.name === it.name);
    if (!c) continue;
    if (numArr(c.d)) { it.d = c.d.slice(); n++; }
    if (it.s && numArr(c.s)) it.s = c.s.slice();
    if (it.s && typeof c.edge === 'number') it.edge = c.edge;
  }
  return n > 0;
}
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (!applyCalib(saved)) applyCalib(window.KALIBRIERUNG);
} catch (e) { try { applyCalib(window.KALIBRIERUNG); } catch (e2) {} }
function save() { try { localStorage.setItem(STORE, JSON.stringify(items)); } catch (e) {} }

const page = document.getElementById('page');
const video = document.getElementById('src');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const info = document.getElementById('info');

page.style.left = cfg.px + '%'; page.style.top = cfg.py + '%';
page.style.width = cfg.pw + '%'; page.style.height = cfg.ph + '%';
page.src = cfg.url;

function resize() { cv.width = innerWidth; cv.height = innerHeight; ctx.imageSmoothingQuality = 'high'; }
addEventListener('resize', resize); resize();

let debug = !!q.get('debug'), sel = 0, edgeOn = cfg.edge !== 'off';

/* ---------- Freistellen ---------- */
function hexToRgb(h) {
  const m = /^#?([0-9a-f]{6})$/i.exec(h || '');
  return m ? [0, 2, 4].map(i => parseInt(m[1].substr(i, 2), 16)) : null;
}
let keyRgb = cfg.key === 'off' ? null : hexToRgb(cfg.key);
const off = document.createElement('canvas');
const octx = off.getContext('2d', { willReadFrequently: true });
octx.imageSmoothingQuality = 'high';
let dt = new Uint16Array(300000);

// Variante 1: Hintergrund transparent machen (ohne Rand-Entfernung), in Zielgröße
function keyedPatch(sx, sy, sw, sh, w, h, recolor) {
  off.width = w; off.height = h;
  octx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
  const img = octx.getImageData(0, 0, w, h), d = img.data;
  const kr = keyRgb[0], kg = keyRgb[1], kb = keyRgb[2];
  for (let i = 0; i < d.length; i += 4) {
    const dist = Math.max(Math.abs(d[i] - kr), Math.abs(d[i + 1] - kg), Math.abs(d[i + 2] - kb));
    let a = (dist - cfg.tol) / cfg.soft;
    a = a < 0 ? 0 : a > 1 ? 1 : a;
    if (recolor) { d[i] = recolor[0]; d[i + 1] = recolor[1]; d[i + 2] = recolor[2]; }
    d[i + 3] = Math.round(a * 255);
  }
  octx.putImageData(img, 0, 0);
  return off;
}

// Variante 2: Hintergrund transparent UND den Rand um die Ziffern abschneiden, egal welche Farbe er hat.
// So wird der Rand erkannt, ohne seine Farbe zu kennen:
//  - Für jedes Pixel wird der Abstand zum nächsten Hintergrundpixel berechnet (Distanztransformation).
//  - Der Rand liegt immer ganz außen an der Ziffer, die Füllung weiter innen. Die Durchschnittsfarbe
//    der äußeren Schicht ist die Randfarbe, die der innersten Pixel die Füllfarbe.
//  - Jedes Pixel wird danach beurteilt, ob es näher an der Rand- oder an der Füllfarbe liegt.
//    Randfarbe wird transparent, Füllfarbe bleibt. Das klappt auch bei dünnen Ziffern.
//  - 'edge' schneidet zusätzlich einen schmalen Saum (Pixel bei 1080p) ganz außen ab, wo Farben verlaufen.
const centers = {};
function edgePatch(name, sx, sy, sw, sh, edgePx, recolor, vh) {
  const w = Math.max(1, Math.round(sw)), h = Math.max(1, Math.round(sh));
  off.width = w; off.height = h;
  octx.drawImage(video, Math.round(sx), Math.round(sy), Math.round(sw), Math.round(sh), 0, 0, w, h);
  const img = octx.getImageData(0, 0, w, h), d = img.data;
  const n = w * h;
  if (dt.length < n) dt = new Uint16Array(n);
  const kr = keyRgb[0], kg = keyRgb[1], kb = keyRgb[2];
  const thr = cfg.tol + cfg.soft * 0.5, BIG = 60000;
  for (let i = 0, p = 0; i < n; i++, p += 4) {
    const dist = Math.max(Math.abs(d[p] - kr), Math.abs(d[p + 1] - kg), Math.abs(d[p + 2] - kb));
    dt[i] = dist > thr ? BIG : 0;
  }
  // Abstand zum Hintergrund (Chamfer 3-4, zwei Durchläufe)
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x; let v = dt[i]; if (!v) continue;
      if (x > 0) v = Math.min(v, dt[i - 1] + 3);
      if (y > 0) {
        v = Math.min(v, dt[i - w] + 3);
        if (x > 0) v = Math.min(v, dt[i - w - 1] + 4);
        if (x < w - 1) v = Math.min(v, dt[i - w + 1] + 4);
      }
      dt[i] = v;
    }
  }
  let maxd = 0;
  for (let y = h - 1; y >= 0; y--) {
    for (let x = w - 1; x >= 0; x--) {
      const i = y * w + x; let v = dt[i]; if (!v) continue;
      if (x < w - 1) v = Math.min(v, dt[i + 1] + 3);
      if (y < h - 1) {
        v = Math.min(v, dt[i + w] + 3);
        if (x < w - 1) v = Math.min(v, dt[i + w + 1] + 4);
        if (x > 0) v = Math.min(v, dt[i + w - 1] + 4);
      }
      dt[i] = v;
      if (v < BIG && v > maxd) maxd = v;
    }
  }
  const scale = vh / 1080;
  // Rand- und Füllfarbe schätzen
  let co = null, cf = null;
  const maxPx = maxd / 3;
  if (maxd > 0 && maxPx >= 2) {
    // Füllung: die innersten Pixel
    let sf = [0, 0, 0], nf = 0;
    const innerFrom = 0.7 * maxd;
    for (let i = 0, p = 0; i < n; i++, p += 4) {
      if (dt[i] >= innerFrom && dt[i] < BIG) { sf[0] += d[p]; sf[1] += d[p + 1]; sf[2] += d[p + 2]; nf++; }
    }
    // Rand: dünne Schicht knapp hinter dem äußersten Verlaufspixel
    const lo = 1.2 * 3, hi = Math.max(lo + 1.5, Math.min(9, 0.35 * maxd));
    let so = [0, 0, 0], no = 0;
    for (let i = 0, p = 0; i < n; i++, p += 4) {
      if (dt[i] >= lo && dt[i] <= hi) { so[0] += d[p]; so[1] += d[p + 1]; so[2] += d[p + 2]; no++; }
    }
    if (nf > 5 && no > 5) {
      co = so.map(v => v / no); cf = sf.map(v => v / nf);
      // zwei Verfeinerungsschritte: Pixel dem näheren Mittelpunkt zuordnen
      for (let it = 0; it < 2; it++) {
        const a1 = [0, 0, 0], a2 = [0, 0, 0]; let c1 = 0, c2 = 0;
        for (let i = 0, p = 0; i < n; i++, p += 4) {
          if (dt[i] < 4.5 || dt[i] >= BIG) continue; // erste 1,5 Pixel (Verlauf zum Hintergrund) auslassen
          const d1 = (d[p] - co[0]) ** 2 + (d[p + 1] - co[1]) ** 2 + (d[p + 2] - co[2]) ** 2;
          const d2 = (d[p] - cf[0]) ** 2 + (d[p + 1] - cf[1]) ** 2 + (d[p + 2] - cf[2]) ** 2;
          if (d1 < d2) { a1[0] += d[p]; a1[1] += d[p + 1]; a1[2] += d[p + 2]; c1++; }
          else { a2[0] += d[p]; a2[1] += d[p + 1]; a2[2] += d[p + 2]; c2++; }
        }
        if (c1 > 5 && c2 > 5) { co = a1.map(v => v / c1); cf = a2.map(v => v / c2); }
      }
    }
  }
  // Farben über die Zeit glätten, damit nichts flackert
  const st = centers[name] || (centers[name] = {});
  if (co && cf) {
    const k = st.co ? Math.min(0.5, 0.15 * 15 / cfg.fps) : 1; // bei wenigen Bildern pro Sekunde schneller nachziehen
    st.co = st.co ? st.co.map((v, j) => v + (co[j] - v) * k) : co;
    st.cf = st.cf ? st.cf.map((v, j) => v + (cf[j] - v) * k) : cf;
  }
  const O = st.co, F = st.cf;
  let ax = 0, ay = 0, az = 0, L2 = 0;
  if (O && F) { ax = F[0] - O[0]; ay = F[1] - O[1]; az = F[2] - O[2]; L2 = ax * ax + ay * ay + az * az; }
  const separated = L2 > 60 * 60; // Rand- und Füllfarbe müssen sich klar unterscheiden
  const fringe = edgePx * scale;
  for (let i = 0, p = 0; i < n; i++, p += 4) {
    let a = dt[i] / 3 - fringe + 0.5;           // äußersten Saum abschneiden
    a = a < 0 ? 0 : a > 1 ? 1 : a;
    if (a > 0 && separated) {
      // Position zwischen Randfarbe (0) und Füllfarbe (1)
      const t = ((d[p] - O[0]) * ax + (d[p + 1] - O[1]) * ay + (d[p + 2] - O[2]) * az) / L2;
      let c = (t - 0.45) / 0.35;
      c = c < 0 ? 0 : c > 1 ? 1 : c;
      a *= c;
    }
    if (recolor) { d[p] = recolor[0]; d[p + 1] = recolor[1]; d[p + 2] = recolor[2]; }
    d[p + 3] = Math.round(a * 255);
  }
  octx.putImageData(img, 0, 0);
  return off;
}

// Automatische Kürzung für Namen, die nicht in der Tabelle stehen:
// Vereinsformen und Vorsilben (TV, TuS, SG, BG ...) und "Basketball", "e.V." weglassen.
const VORSILBEN = /^(tv|tus|tsv|tsve|sv|sg|bg|bc|vfl|vfvb|vfb|dtv|djk|mtg|btv|ubc|rsv|sca|fc|bbv|etb|isd|tve|s\.c\.|sportclub|turnverein|post|polizei)\s+/;
// Wirksame Liste: eingebaute Reserve, darüber die Datei kurznamen.json von GitHub (Groß-/Kleinschreibung egal)
let KURZNAMEN = {};
function setKurz(obj) {
  const m = {};
  for (const k in KURZ_EINGEBAUT) m[normName(k)] = KURZ_EINGEBAUT[k];
  for (const k in (obj || {})) if (typeof obj[k] === 'string' && !k.startsWith('_')) m[normName(k)] = obj[k];
  KURZNAMEN = m;
}
const KCACHE = 'halle-kurz-cache';
let kurzStatus = 'noch nicht geladen';
async function loadKurz() {
  try {
    // Erst die konfigurierte Adresse, dann die Variante mit großem K (GitHub unterscheidet Groß-/Kleinschreibung)
    const urls = [cfg.kurz, cfg.kurz.replace(/kurznamen\.json/i, 'Kurznamen.json')];
    let res = null;
    for (const u of urls) {
      try { res = await fetch(u, { cache: 'no-store' }); if (res.ok) break; } catch (e) { res = null; }
    }
    if (!res || !res.ok) throw new Error(res ? 'HTTP ' + res.status : 'nicht erreichbar');
    const j = await res.json();
    setKurz(j);
    kurzStatus = 'von GitHub geladen (' + Object.keys(j).filter(k => !k.startsWith('_')).length + ' Einträge) ' + new Date().toLocaleTimeString('de-DE');
    try { localStorage.setItem(KCACHE, JSON.stringify(j)); } catch (e) {}
  } catch (e) {
    kurzStatus = 'FEHLER beim Laden (' + e.message + ') - alte Liste aus Zwischenspeicher/Reserve';
    try { setKurz(JSON.parse(localStorage.getItem(KCACHE) || '{}')); } catch (e2) { setKurz({}); }
  }
}
function normName(n) { return String(n || '').normalize('NFC').toLowerCase().replace(/[\u2010-\u2015]/g, '-').replace(/\s+/g, ' ').trim(); }
function autoKurz(n) {
  let t = n;
  for (let i = 0; i < 4; i++) { const u = t.replace(VORSILBEN, ''); if (u === t) break; t = u; }
  t = t.replace(/\b(basketball|basketballabteilung|baskets|e\.v\.)\b/g, ' ').replace(/\s+/g, ' ').trim();
  return t || n;
}
function kurzname(voll) {
  const n = normName(voll);
  if (KURZNAMEN[n]) return KURZNAMEN[n];
  let base = n, suffix = '';
  const m = n.match(/^(.*\S)\s+([2-9])$/);            // Zweitmannschaft: " 2", " 3" ...
  if (m) { base = m[1]; suffix = ' ' + m[2]; }
  return (KURZNAMEN[base] || autoKurz(base)) + suffix;
}

setKurz({});
let games = [], lockGame = null; // lockGame: das festgehaltene Spiel (bleibt, bis neu gewählt wird)
const GCACHE = 'halle-games-cache';
function parseGames(arr) {
  return (Array.isArray(arr) ? arr : []).map(g => Object.assign({}, g, { t: new Date(g.datetime).getTime() }))
    .filter(g => !isNaN(g.t)).sort((a, b) => a.t - b.t);
}
async function loadGames() {
  try {
    const res = await fetch(cfg.games, { cache: 'no-store' });
    const j = await res.json();
    games = parseGames(j);
    try { localStorage.setItem(GCACHE, JSON.stringify(j)); } catch (e) {}
  } catch (e) {
    try { games = parseGames(JSON.parse(localStorage.getItem(GCACHE) || '[]')); } catch (e2) {}
  }
}

let sponsorImg = null, jugendImg = null, sponsorStatus = 'noch nicht geladen', sponsorAn = true;   // X: Banner von Hand aus/ein
function istSpieltag() {
  if (cfg.sponsorimmer) return true;
  const key = t => new Date(t).toLocaleDateString('sv-SE', { timeZone: 'Europe/Berlin' });
  const heute = key(nowMs());
  const list = cfg.ort ? games.filter(g => String(g.ort || '').toLowerCase().includes(cfg.ort.toLowerCase())) : games;
  const bt = String(cfg.bannerteam || '').toLowerCase();
  return list.some(g => key(g.t) === heute && (!bt || String(g.team || '').toLowerCase().includes(bt)));
}
async function holeBild(url) {   // null = 404 (Datei fehlt), sonst Bild; Fehler werden weitergereicht
  const res = await fetch(url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now(), { cache: 'no-store' });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return await createImageBitmap(await res.blob());
}
async function loadSponsor(erzwingen) {
  if (!cfg.sponsor || cfg.sponsor === 'aus') { sponsorStatus = 'ausgeschaltet'; return; }
  if (erzwingen !== true && !istSpieltag()) { sponsorImg = null; jugendImg = null; sponsorStatus = 'kein Heimspiel heute - nicht geladen'; return; }
  const teile = [];
  for (const [name, url, set] of [['Sponsor', cfg.sponsor, v => { sponsorImg = v; }], ['Jugend', cfg.sponsorjugend, v => { jugendImg = v; }]]) {
    if (!url || url === 'aus') continue;
    try {
      let img = await holeBild(url), welche = name;
      if (!img && name === 'Sponsor' && cfg.sponsorohne && cfg.sponsorohne !== 'aus') { img = await holeBild(cfg.sponsorohne); welche = 'ohne Sponsor'; }
      set(img);
      teile.push(name + ': ' + (img ? 'geladen (' + welche + ')' : 'keine Datei auf GitHub'));
    } catch (e) {
      teile.push(name + ': FEHLER (' + e.message + ')');
    }
  }
  sponsorStatus = teile.join(', ') + ' ' + new Date().toLocaleTimeString('de-DE');
}
// D1 (1. Damen) hat eigene Banner. Alle anderen Teams (U10 ... U18, 2. Damen, 3. Damen) nehmen Jugend_Spieltag.png mit Team und Liga als Text.
function istD1(g) { return /^\s*(1\s*\.\s*damen|d\s*1)\b/i.test(String((g && g.team) || '')); }
function istJugend(g) { return !!(g && g.team && !istD1(g)); }
// Text im Jugendbanner (Mannschaft + Liga aus dem Spielplan). Position/Größe passend zur Datei spieltagssponsor_jugend.png (2400 x 195 px).
function jugendText(g, ox, oy, k) {
  const FX = 1133, FW = 440;            // Mitte und nutzbare Breite des Textfelds im Bild (Pixel)
  const team = String(g.team || '').trim().toLocaleUpperCase('de-DE');
  const liga = String(g.liga || '').trim().toLocaleUpperCase('de-DE');
  const fam = '"Liberation Sans", Arial, Helvetica, sans-serif';
  const zeile = (t, px, y) => {
    if (!t) return;
    let f = px; ctx.font = 'bold ' + (f * k) + 'px ' + fam;
    const w = ctx.measureText(t).width, max = FW * k;
    if (w > max) { f = f * max / w; ctx.font = 'bold ' + (f * k) + 'px ' + fam; }
    ctx.fillText(t, ox + FX * k, oy + y * k);
  };
  ctx.save(); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  zeile(team, 68, 69.5); zeile(liga, 42, 146.5);
  ctx.restore();
}
function nowMs() { return cfg.now ? new Date(cfg.now).getTime() : Date.now(); }

// Automatik: läuft gerade ein Spiel (Anwurf bis 2 Stunden danach), gilt das zuletzt begonnene.
// Sonst das nächste Spiel, das beginnt. Sind alle vorbei, das letzte.
function pickAuto() {
  const t = nowMs(), DAUER = 120 * 60000;
  const list = cfg.ort ? games.filter(g => String(g.ort || '').toLowerCase().includes(cfg.ort.toLowerCase())) : games;
  let best = null;
  for (const g of list) if (g.t <= t && t < g.t + DAUER) best = g;
  if (best) return best;
  for (const g of list) if (g.t > t) return g;
  return list.length ? list[list.length - 1] : null;
}
function currentGame() {
  if (cfg.gegner) return { team: cfg.team, gegner: cfg.gegner };
  // Das Spiel wird einmal gewählt und dann festgehalten. Neu gewählt wird beim Beenden der Kalibrierung (Taste D) oder mit A.
  if (!lockGame) lockGame = pickAuto();
  return lockGame;
}
const TZ = 'Europe/Berlin';
const dayKey = g => new Date(g.t).toLocaleDateString('de-DE', { timeZone: TZ });
function uhr(g) { return new Date(g.t).toLocaleTimeString('de-DE', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }); }
function cycleGame(dir) {
  const ref = currentGame();
  if (!ref || !ref.t) { say('Kein Spiel gefunden'); return; }
  const day = games.filter(g => dayKey(g) === dayKey(ref));
  let i = day.findIndex(g => g.t === ref.t && g.gegner === ref.gegner);
  i = (i + dir + day.length) % day.length;
  lockGame = day[i];
  gameInfo('Spiel ' + (i + 1) + ' von ' + day.length + ' an diesem Tag (festgehalten, A = automatisch neu wählen)');
}
function gameInfo(kopf) {
  const g = currentGame();
  say((kopf ? kopf + '\n' : '') + (g ? (g.t ? uhr(g) + ' Uhr  ' : '') + (g.liga ? g.liga + '  ' : '') + g.team + ' gegen ' + g.gegner +
    '\nAnzeige: ' + heimLabel(g) + ' / ' + gastLabel(g) +
    '\nGegner laut Spielplan: "' + g.gegner + '"  Suchschlüssel: "' + normName(g.gegner) + '"' +
    '\nIn Kurznamenliste: ' + (KURZNAMEN[normName(g.gegner)] ? 'ja' : 'nein (automatische Kürzung)') +
    '\nKurznamen: ' + kurzStatus +
    '\nSponsor: ' + sponsorStatus : 'Kein Spiel gefunden'));
}
// Ist am Spieltag der Banner oben an (für D1 steht die Liga fest im Bild, sonst Mannschaft und Liga als Text), heißt die Heimzeile im Scoreboard nur noch "OBERHAUSEN".
function bannerZeigtTeam(g) { return !!(cfg.heimname && sponsorAn && g && g.team && istSpieltag()); }
function heimLabel(g) {
  if (bannerZeigtTeam(g)) return cfg.heimname.toLocaleUpperCase('de-DE');
  return (cfg.heim.toLocaleUpperCase('de-DE') + ' ' + (g && g.team ? g.team : '')).trim();
}
function gastLabel(g) { return g && g.gegner ? kurzname(g.gegner).toLocaleUpperCase('de-DE') : 'GÄSTE'; }

const FONT = '"Roboto", "Helvetica Neue", Arial, "Liberation Sans", "DejaVu Sans", sans-serif';
function drawText(r, W, H, str) {
  const x = r.d[0] / 100 * W, y = r.d[1] / 100 * H, w = r.d[2] / 100 * W, h = r.d[3] / 100 * H;
  let size = h * 0.88;
  ctx.font = '700 ' + size + 'px ' + FONT;
  const tw = ctx.measureText(str).width;
  if (tw > w) { size = Math.max(size * w / tw, h * 0.5); ctx.font = '700 ' + size + 'px ' + FONT; }
  let t = str;
  while (ctx.measureText(t).width > w && t.length > 1) t = t.slice(0, -1);  // Notbremse: abschneiden
  if (t !== str) t = t.slice(0, -1) + '…';
  ctx.fillStyle = r.color || '#ffffff';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y + h / 2 + size * 0.04);
}

/* ---------- Zeichnen ---------- */
function draw() {
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  // 1. Kästen
  for (const r of items) {
    if (!r.plate) continue;
    ctx.fillStyle = r.color || cfg.plate;
    // Wurfuhr aus: Kasten wird zum schmalen Balken (wie der Streifen links), wie im Original der Liga
    const bw = (wurfAus && r.name === 'Kasten Wurfuhr') ? 0.31 : r.d[2];
    ctx.fillRect(r.d[0] / 100 * W, r.d[1] / 100 * H, bw / 100 * W, r.d[3] / 100 * H);
  }
  // 1b. Mannschaftsnamen
  const gm = currentGame();
  for (const r of items) {
    if (r.text) drawText(r, W, H, r.text === 'heim' ? heimLabel(gm) : gastLabel(gm));
  }
  // 2. Ausschnitte aus dem Grabber-Bild
  const vw = video.videoWidth, vh = video.videoHeight;
  if (vw) {
    for (const r of items) {
      if (r.plate || r.text || r.bild) continue;
      if (wurfAus && r.name === 'Wurfuhr') continue;   // W: Wurfuhr-Ziffern ausgeblendet
      const sx = r.s[0] / 100 * vw, sy = r.s[1] / 100 * vh;
      const sw = r.s[2] / 100 * vw, sh = r.s[3] / 100 * vh;
      const dx = r.d[0] / 100 * W,  dy = r.d[1] / 100 * H;
      const dw = r.d[2] / 100 * W,  dh = r.d[3] / 100 * H;
      let ox = dx, oy = dy, ow = dw, oh = dh;
      if ((r.fit || 'contain') === 'contain') {
        const k = Math.min(dw / sw, dh / sh);
        ow = sw * k; oh = sh * k; ox = dx + (dw - ow) / 2; oy = dy + (dh - oh) / 2;
      }
      if (keyRgb && edgeOn && r.edge > 0) {
        const p = edgePatch(r.name, sx, sy, sw, sh, r.edge, r.recolor, vh);
        ctx.drawImage(p, 0, 0, p.width, p.height, ox, oy, ow, oh);
      } else if (keyRgb) {
        const w = Math.max(1, Math.round(ow)), h = Math.max(1, Math.round(oh));
        ctx.drawImage(keyedPatch(sx, sy, sw, sh, w, h, r.recolor), Math.round(ox), Math.round(oy));
      } else {
        ctx.drawImage(video, sx, sy, sw, sh, ox, oy, ow, oh);
      }
    }
  }
  // 3. Banner oben: Standardbanner, darüber (falls auf GitHub vorhanden) das Sponsorbild. Nur am Spieltag, im Kalibrier-Modus immer.
  const sp = items.find(r => r.bild);
  if (sp && (debug || (sponsorAn && istSpieltag()))) {
    const bx = sp.d[0] / 100 * W, by = sp.d[1] / 100 * H, bw2 = sp.d[2] / 100 * W, bh2 = sp.d[3] / 100 * H;
    const gg = currentGame(), jug = istJugend(gg);
    for (const img of [defaultImg, jug ? jugendImg : sponsorImg]) {
      if (!img) continue;
      const k = Math.min(bw2 / img.width, bh2 / img.height);
      const iw = img.width * k, ih = img.height * k;
      const ox = bx + (bw2 - iw) / 2, oy = by + (bh2 - ih) / 2;
      ctx.drawImage(img, ox, oy, iw, ih);
      if (jug && img === jugendImg) jugendText(gg, ox, oy, k);
    }
  }
  if (debug) drawDebug(W, H, vw, vh);
}

function drawDebug(W, H, vw, vh) {
  ctx.lineWidth = 2; ctx.font = '14px Arial'; ctx.textBaseline = 'top';
  items.forEach((r, i) => {
    ctx.strokeStyle = i === sel ? '#ff2020' : (r.plate ? '#00e5ff' : (r.text || r.bild) ? '#7cfc00' : '#ffe000');
    ctx.strokeRect(r.d[0] / 100 * W, r.d[1] / 100 * H, r.d[2] / 100 * W, r.d[3] / 100 * H);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fillText((i + 1) + ' ' + r.name, r.d[0] / 100 * W, r.d[1] / 100 * H - 17);
  });
  // Quellbild klein unten rechts, mit den Quell-Rechtecken
  if (vw) {
    const mw = W * 0.34, mh = mw * vh / vw, mx = W - mw - 10, my = H - mh - 10;
    ctx.fillStyle = '#000'; ctx.fillRect(mx - 2, my - 2, mw + 4, mh + 4);
    ctx.drawImage(video, mx, my, mw, mh);
    items.forEach((r, i) => {
      if (r.plate || r.text || r.bild) return;
      ctx.strokeStyle = i === sel ? '#ff2020' : '#ffe000';
      ctx.strokeRect(mx + r.s[0] / 100 * mw, my + r.s[1] / 100 * mh, r.s[2] / 100 * mw, r.s[3] / 100 * mh);
      ctx.fillStyle = ctx.strokeStyle;
      ctx.fillText(String(i + 1), mx + r.s[0] / 100 * mw + 2, my + r.s[1] / 100 * mh + 2);
    });
  }
}

setInterval(draw, 1000 / cfg.fps);

/* ---------- Grabber ---------- */
let devices = [], current = 0;

async function start(deviceId) {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const v = { width: { ideal: cfg.w }, height: { ideal: cfg.h }, frameRate: { ideal: 30 } };
  if (deviceId) v.deviceId = { exact: deviceId };
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: v, audio: false });
  video.play().catch(() => {});
}

async function init() {
  if (cfg.datei) {   // Testmodus: aufgenommenes Video als Quelle (Endlosschleife)
    video.srcObject = null;
    video.muted = true; video.loop = true; video.playsInline = true;
    video.src = cfg.datei;
    video.play().catch(e => say('Video startet nicht: ' + e.message));
    return;
  }
  try {
    const tmp = await navigator.mediaDevices.getUserMedia({ video: true });
    tmp.getTracks().forEach(t => t.stop());
    devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    if (cfg.dev) {
      const i = devices.findIndex(d => d.label.toLowerCase().includes(cfg.dev.toLowerCase()));
      if (i >= 0) current = i;
    }
    await start(devices[current] && devices[current].deviceId);
  } catch (e) {
    say('Kein Videosignal: ' + e.message);
  }
}

/* ---------- Bedienung ---------- */
// P: Kalibrierung als Datei sichern (kalibrierung.js) und kompakt anzeigen
function exportKalib() {
  const rows = items.map(it => {
    const o = { name: it.name, d: it.d };
    if (it.s) { o.s = it.s; o.edge = it.edge || 0; }
    return '  ' + JSON.stringify(o);
  });
  const text = '// Kalibrierung für overlay-roi.html (neben die Seite legen)\nwindow.KALIBRIERUNG = [\n' + rows.join(',\n') + '\n];\n';
  let dl = '';
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/javascript' }));
    a.download = 'kalibrierung.js';
    document.body.appendChild(a); a.click(); a.remove();
    dl = 'Datei kalibrierung.js wurde heruntergeladen (Ordner Downloads).\nLege sie neben overlay-roi.html, dann gilt sie auch ohne Browser-Speicher.\n\n';
  } catch (e) { dl = 'Download nicht möglich, Werte bitte abschreiben:\n\n'; }
  say(dl + rows.map(r => r.trim()).join('\n'));
}

let sayTimer = null;
function say(t) {
  info.style.display = 'block'; info.textContent = t;
  clearTimeout(sayTimer);
  // Außerhalb der Kalibrierung verschwinden Hinweise nach 5 s (damit sie nicht im Sendebild stehen bleiben)
  if (!debug) sayTimer = setTimeout(() => { if (!debug) info.style.display = 'none'; }, 5000);
}

// Alles ausblenden (Scoreboard + Liga-Seite): übrig bleibt nur die Hintergrundfarbe (Magenta = durchsichtig)
// aus = false (alles sichtbar) | 'overlay' (nur eigenes Scoreboard + Videos weg, Liga-Seite bleibt) | 'alles' (auch Liga-Seite weg)
let aus = false;
function setAus(mode) {
  aus = mode;
  cv.style.visibility = aus ? 'hidden' : 'visible';
  page.style.visibility = aus === 'alles' ? 'hidden' : 'visible';
}
let wurfAus = false;       // W: Wurfuhr (24 Sek) ausblenden
let quelleModus = false;   // S: Pfeile/Strg/+/- wirken auf die Quelle statt auf das Ziel

/* ---------- Hintergrundmusik (MP3 neben der Seite, Taste M) ---------- */
// Eine MP3-Datei in Endlosschleife; M blendet sie ein/aus. Ton geht über HDMI zum ATEM.
let musikAn = false, fadeTimer = null, audio = null;
if (cfg.musik) {
  audio = new Audio(cfg.musik);
  audio.loop = true; audio.volume = 0; audio.preload = 'auto';
}
function fadeTo(ziel, fertig) {
  clearInterval(fadeTimer);
  const von = audio.volume, schritte = Math.max(1, Math.round(cfg.fade * 20));
  let i = 0;
  fadeTimer = setInterval(() => {
    i++; audio.volume = Math.min(1, Math.max(0, von + (ziel - von) * i / schritte));
    if (i >= schritte) { clearInterval(fadeTimer); if (fertig) fertig(); }
  }, 50);
}
function toggleMusik() {
  if (!audio) { say('Keine Musik eingestellt'); return; }
  musikAn = !musikAn;
  if (musikAn) {
    audio.play().then(() => { fadeTo(cfg.vol / 100); say('Musik an'); })
      .catch(err => { musikAn = false; say('Musik: ' + (cfg.musik) + ' nicht abspielbar (' + err.name + ')'); });
  } else {
    fadeTo(0, () => audio.pause());
    say('Musik aus');
  }
}

function help() {
  const r = items[sel];
  say('Tasten:\n' +
    'D  Kalibrier-Modus an/aus (Rahmen: gelb = Ausschnitt, blau = Kasten, Quellbild unten rechts)\n' +
    'N  nächstes Element wählen (rot)\n' +
    'Pfeile  Ziel verschieben (Shift = grob)\n' +
    'Alt + Pfeile  Quelle verschieben (nur Ausschnitte)\n' +
    '+ / -  Ziel größer/kleiner   (Alt: Quelle)\n' +
    'Strg + Pfeile  Breite/Höhe einzeln   (Alt+Strg: Quelle)\n' +
    'S  Quelle/Ziel umschalten (dann gilt alles oben ohne Alt)   jetzt: ' + (quelleModus ? 'QUELLE' : 'Ziel') + '\n' +
    '[ / ]  Saum außen kleiner/größer abschneiden (Shift = grob)\n' +
    'E  Rand-Entfernung an/aus    K  Freistellen an/aus\n' +
    'B  eigenes Overlay aus/ein (Liga-Seite bleibt)   Shift+B  alles aus/ein\n' +
    'W  Wurfuhr (24 Sek) aus/ein    X  Sponsor-Banner aus/ein\n' +
    'M  Hintergrundmusik ein-/ausblenden (musik.mp3)\n' +
    'G  nächstes Spiel am selben Tag (Shift: vorheriges)   A  Spiel neu nach Uhrzeit wählen   I  Spielinfo\n' +
    'P  Kalibrierung als Datei sichern (kalibrierung.js)   R  Werte zurücksetzen\n' +
    'C  nächstes Videogerät       H  diese Hilfe aus/an\n\n' +
    'Gewählt: ' + (sel + 1) + ' ' + r.name + (r.s ? '   Saum: ' + (r.edge || 0) : ''));
}

addEventListener('keydown', async e => { try { await onKey(e); } finally { draw(); } });
async function onKey(e) {
  const k = e.key, r = items[sel];
  const step = e.shiftKey ? 1 : 0.1;
  const tgt = (e.altKey || quelleModus) && r.s ? r.s : r.d;
  const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };

  // Kalibriertasten wirken nur im Kalibrier-Modus (D), damit versehentliche Drücke nichts verschieben
  if (!debug && (arrows[k] || ['n', 'N', 'e', 'E', 'k', 'K', 'r', 'R', '[', ']', '+', '-', '='].includes(k))) return;
  if (k === 'b' || k === 'B') {   // B: nur eigenes Overlay aus/ein   Shift+B: alles aus/ein
    setAus(aus ? false : (e.shiftKey ? 'alles' : 'overlay'));
    if (aus) info.style.display = 'none'; return;
  }
  if (k === 'm' || k === 'M') { toggleMusik(); return; }
  if (k === 'x' || k === 'X') { sponsorAn = !sponsorAn; say('Sponsor: ' + (sponsorAn ? 'an' : 'aus') + ' (' + sponsorStatus + ')'); return; }
  if (k === 'w' || k === 'W') { wurfAus = !wurfAus; say('Wurfuhr: ' + (wurfAus ? 'aus' : 'an')); return; }
  if (k === 's' || k === 'S') { quelleModus = !quelleModus; if (info.style.display === 'block') help(); else say('Bearbeiten: ' + (quelleModus ? 'Quelle' : 'Ziel')); return; }
  if (k === 'h' || k === 'H') { info.style.display === 'block' ? info.style.display = 'none' : help(); return; }
  if (k === 'd' || k === 'D') { if (aus) setAus(false); debug = !debug; if (debug) { help(); if (!sponsorImg) loadSponsor(true); } else { info.style.display = 'none'; lockGame = null; } return; }  // Kalibrierung beenden = Spiel nach Uhrzeit neu wählen und festhalten
  if (k === 'n' || k === 'N') { sel = (sel + 1) % items.length; if (info.style.display === 'block') help(); return; }
  if (k === 'k' || k === 'K') {
    keyRgb = keyRgb ? null : (hexToRgb(cfg.key) || hexToRgb('#d3d3d3'));
    say('Freistellen: ' + (keyRgb ? 'an' : 'aus')); return;
  }
  if (k === 'e' || k === 'E') { edgeOn = !edgeOn; say('Rand-Entfernung: ' + (edgeOn ? 'an' : 'aus')); return; }
  if (k === '[' || k === ']') {
    if (r.s) {
      const dv = (k === ']' ? 1 : -1) * (e.shiftKey ? 1 : 0.5);
      r.edge = Math.max(0, +((r.edge || 0) + dv).toFixed(1)); save(); help();
    }
    return;
  }
  if (k === 'g' || k === 'G') { cycleGame(e.shiftKey ? -1 : 1); return; }
  if (k === 'a' || k === 'A') { lockGame = null; gameInfo('Spiel nach Uhrzeit neu gewählt und festgehalten'); return; }
  if (k === 'i' || k === 'I') { gameInfo(''); return; }
  if (k === 'c' || k === 'C') {
    if (devices.length) { current = (current + 1) % devices.length; await start(devices[current].deviceId);
      say('Gerät: ' + (devices[current].label || current)); }
    return;
  }
  if (k === 'r' || k === 'R') { items = JSON.parse(JSON.stringify(DEFAULT_ITEMS)); save(); say('Zurückgesetzt'); return; }
  if (k === 'p' || k === 'P') { exportKalib(); return; }

  if (arrows[k]) {
    e.preventDefault();
    const [dx, dy] = arrows[k];
    if (e.ctrlKey) { tgt[2] = +(tgt[2] + dx * step).toFixed(2); tgt[3] = +(tgt[3] + dy * step).toFixed(2); }
    else { tgt[0] = +(tgt[0] + dx * step).toFixed(2); tgt[1] = +(tgt[1] + dy * step).toFixed(2); }
    save(); return;
  }
  if (k === '+' || k === '-' || k === '=') {
    const f = k === '-' ? 0.98 : 1.02;
    tgt[2] = +(tgt[2] * f).toFixed(2); tgt[3] = +(tgt[3] * f).toFixed(2);
    save();
  }
}

if (!cfg.datei) navigator.mediaDevices.addEventListener('devicechange', init);
init();
loadGames().then(loadSponsor); loadKurz();
setInterval(() => { loadGames().then(loadSponsor); loadKurz(); }, 10 * 60 * 1000); // JSON alle 10 Minuten neu laden
</script>
</body>
